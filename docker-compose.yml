services:
  # ----------------------------------------
  # DATABASE SERVICE (MySQL)
  # ----------------------------------------
  db:
    image: mysql:8.0
    container_name: sportbet-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # BACKEND SERVICE (Express + Prisma)
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportbet-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # Optional: Map current code for hot reloading if you prefer
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules

  # ----------------------------------------
  # FRONTEND SERVICE (React + Vite)
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sportbet-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
